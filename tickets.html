<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>旅遊票夾｜荷比德冬季旅行</title>
  <link rel="stylesheet" href="assets/tickets.css">
  <script type="module" src="assets/tickets.js"></script>
</head>
<body>
<main>
  <a href="./">← 回旅行手冊</a>
  <h1>旅遊票夾</h1>
  <form id="unlock">
    <label for="password">票夾密碼</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">解鎖票券</button>
  </form>
  <p id="status" role="status"></p>
  <section id="wallet" aria-label="票券列表" hidden>
    <button id="lock" type="button">鎖定票夾</button>
    <div id="tickets"></div>
  </section>
</main>
</body>
</html>
